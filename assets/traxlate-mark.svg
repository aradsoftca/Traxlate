      <stop offset="0" stop-color="#23d5c2"/>
      <stop offset="1" stop-color="#8a6bff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#12161d"/>
  <path d="M7 8h18v4.6h-6.6V25h-4.8V12.6H7Z" fill="#f1eee7"/>
  <circle cx="24" cy="23" r="3.4" fill="url(#phos)"/>
</svg>
